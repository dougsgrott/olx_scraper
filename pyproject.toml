[project]
name = "olx-scraper"
version = "0.1.0"
description = "Add your description here"
readme = "readme.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "boto3>=1.43.40",
    "fastapi>=0.143.0",
    "jinja2>=3.1.6",
    "patchright>=1.59.1",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "scrapy>=2.16.0",
    "scrapy-playwright>=0.0.46",
    "six>=1.17.0",
    "sqlalchemy>=2.0.49",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
