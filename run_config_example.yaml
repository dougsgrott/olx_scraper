# Configuration for the OLX scraper run script

# Set the mode for the scraper.
# Options: 'CATALOG', 'AD', or 'WARM' (warm the Playwright profile past Cloudflare).
mode: 'CATALOG'

# Settings for the Catalog Spider
catalog_spider:
  # A list of URLs to start scraping from.
  # The spider will process each URL and its subsequent pages.
  start_urls:
    - "https://www.olx.com.br/imoveis/aluguel/estado-sc/florianopolis-e-regiao"

  # Optional early stopping — omit the block to always paginate to the end.
  # OLX keeps stale (already-rented) ads online, so incremental runs mostly
  # re-encounter known uids; these rules cut pagination short once a run
  # stops finding new listings. Works best with newest-first start URLs
  # (add ?sf=t to sort by "Mais recentes").
  # early_stop:
  #   patience: 2           # stop after this many consecutive stale pages (0 = off)
  #   min_new_per_page: 1   # a page is stale when it yields fewer new items than this
  #   max_pages: 0          # hard cap on pages per start URL (0 = unlimited)

# Settings for the Ad Spider
ad_spider:
  # Defines where the spider gets its URLs.
  # Options:
  #   'database': Fetches unscraped ad URLs from the database (default operation).
  #   'urls': Scrapes only the specific URLs provided in the start_urls list below.
  source: 'database'

  # A list of specific ad URLs to scrape.
  # This is only used if the source is set to 'urls'.
  start_urls:
    - "some_valid_url_from_some_item_to_be_scraped"
